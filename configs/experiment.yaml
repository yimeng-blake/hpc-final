frequency_hz: 1000000000
word_bytes: 1
output_overhead_cycles: 0

resolutions:
  720p:
    width: 1280
    height: 720
    deadlines_ms: [33, 100, 200]
  1080p:
    width: 1920
    height: 1080
    deadlines_ms: [33, 100, 200]
  hires:
    width: 2048
    height: 2048
    deadlines_ms: [33, 100, 200]

gaussian_kernels: [3, 5, 7, 11]
array_sizes: [8, 16, 32, 64, 128]
sram_budgets_kb: [256, 1024, 4096]
bandwidths_gbps: [50, 200, 800]
dataflows: ["ws", "os"]

tile_sizes:
  sanity:
    width: 64
    height: 64
  full:
    width: 128
    height: 128

sanity_sweep:
  resolutions: ["720p"]
  gaussian_kernels: [3, 5]
  array_sizes: [8, 16]
  sram_budgets_kb: [1024]
  bandwidths_gbps: [50, 200]
  dataflows: ["ws"]

energy:
  mac_pj: 0.23
  mac_source: "Reference-level 8-bit MAC assumption; modeled as 8-bit multiply plus add."
  dram_pj_per_byte: 160.0
  dram_source: "Reference-level off-chip DRAM assumption; CACTI is used only for on-chip SRAM."
  sram:
    source: "cacti"
    table: "cacti_sram_45nm.csv"
    technology_nm: 45
    access_bytes: 4

scalesim:
  read_request_buffer: 32
  write_request_buffer: 32
  ifmap_sram_fraction: 0.45
  filter_sram_fraction: 0.10
  ofmap_sram_fraction: 0.45
